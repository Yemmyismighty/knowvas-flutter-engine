name: knowvas
description: "Knowvas - A cross-platform mobile and desktop application for digital content reading."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Network
  dio: ^5.7.0
  connectivity_plus: ^6.0.5

  # Local Storage
  sqflite: ^2.3.3+2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # Image Loading
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Fonts
  # google_fonts removed - DM Sans is bundled as an asset font

  # File Handling
  file_picker: ^8.1.4

  # WebView for PDF reader (DearFlip)
  flutter_inappwebview: ^6.1.5
  webview_flutter: ^4.10.0

  # Iridium for EPUB reader (Readium 2 Flutter port)
  iridium_reader_widget:
    git:
      url: https://github.com/Mantano/iridium.git
      path: reader_widget
      ref: main

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  crypto: ^3.0.5
  encrypt: ^5.0.3
  logger: ^2.4.0
  equatable: ^2.0.5
  url_launcher: ^6.3.1
  mime: ^1.0.6

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1



dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0
  freezed: ^2.5.7

  # Testing
  sqflite_common_ffi: ^2.3.3
  integration_test:
    sdk: flutter

  # Launcher Icons
  flutter_launcher_icons: ^0.13.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Enable generation of localization files
  generate: true

  # App assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/logo.png
    - assets/sample.epub
    - assets/sample.pdf
    - assets/reader/
    - assets/reader/reader.html
    - assets/reader/dflip/js/
    - assets/reader/dflip/css/
    - assets/reader/dflip/fonts/
    - assets/reader/dflip/images/
    - assets/reader/epubjs/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Custom fonts
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/DMSans-BoldItalic.ttf
          weight: 700
          style: italic
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Launcher Icons Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
