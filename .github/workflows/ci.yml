name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # Flutter lint, format, and unit tests
  flutter-test:
    name: Flutter Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: knowvas_flutter_client

      - name: Verify formatting
        run: dart format --set-exit-if-changed .
        working-directory: knowvas_flutter_client

      - name: Analyze code
        run: flutter analyze
        working-directory: knowvas_flutter_client

      - name: Run unit tests
        run: flutter test --coverage
        working-directory: knowvas_flutter_client

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: knowvas_flutter_client/coverage/lcov.info
          flags: flutter
          name: flutter-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Android tests with emulator
  android-test:
    name: Android Tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [29, 33]
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: knowvas_flutter_client

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            cd knowvas_flutter_client
            flutter test integration_test

      - name: Run Android native tests
        run: |
          cd knowvas_flutter_client/android
          ./gradlew test --stacktrace
        continue-on-error: true

  # iOS tests with simulator
  ios-test:
    name: iOS Tests
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: knowvas_flutter_client

      - name: Start iOS Simulator
        run: |
          xcrun simctl boot "iPhone 15 Pro" || true
          xcrun simctl list devices

      - name: Run iOS integration tests
        run: flutter test integration_test --device-id=$(xcrun simctl list devices | grep "iPhone 15 Pro" | grep -o '[A-F0-9-]\{36\}' | head -1)
        working-directory: knowvas_flutter_client
        continue-on-error: true

      - name: Run iOS native tests
        run: |
          cd knowvas_flutter_client/ios
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner -destination 'platform=iOS Simulator,name=iPhone 15 Pro' || true
        continue-on-error: true

  # Build Android artifacts
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [flutter-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: knowvas_flutter_client

      - name: Build APK
        run: flutter build apk --release
        working-directory: knowvas_flutter_client

      - name: Build App Bundle
        run: flutter build appbundle --release
        working-directory: knowvas_flutter_client

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: knowvas_flutter_client/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: knowvas_flutter_client/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # Build iOS artifacts
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: [flutter-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: knowvas_flutter_client

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
        working-directory: knowvas_flutter_client

      - name: Create IPA archive info
        run: |
          echo "iOS build completed successfully" > knowvas_flutter_client/build/ios/iphoneos/build-info.txt
          echo "Note: Code signing and IPA creation require proper certificates and provisioning profiles" >> knowvas_flutter_client/build/ios/iphoneos/build-info.txt
          echo "For signed builds, configure signing in Xcode and use: flutter build ipa" >> knowvas_flutter_client/build/ios/iphoneos/build-info.txt

      - name: Upload iOS build info
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-info
          path: knowvas_flutter_client/build/ios/iphoneos/build-info.txt
          retention-days: 30
