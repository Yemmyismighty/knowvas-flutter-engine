# SwiftLint configuration for iOS Swift code
# https://github.com/realm/SwiftLint

disabled_rules:
  - trailing_comma
  - todo
  - line_length

opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument

excluded:
  - Pods
  - .build
  - GeneratedPluginRegistrant.swift
  - GeneratedPluginRegistrant.h
  - GeneratedPluginRegistrant.m

line_length:
  warning: 120
  error: 150
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 300
  error: 500

identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - z

cyclomatic_complexity:
  warning: 10
  error: 20

nesting:
  type_level:
    warning: 2
  statement_level:
    warning: 5

reporter: "xcode"
